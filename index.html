<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS FINAL</title>
    <style>
        body { margin: 0; background: #000; color: #00d4ff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .sphere { width: 120px; height: 120px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 25px #00d4ff; cursor: pointer; background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, rgba(0,0,0,1) 70%); }
        .listening { border-color: #fff; box-shadow: 0 0 50px #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin: 20px; text-align: center; font-size: 14px; color: #fff; height: 60px; overflow-y: auto; width: 80%; }
        .input-box { display: flex; gap: 10px; background: #111; padding: 10px; border-radius: 25px; border: 1px solid #333; }
        input { background: none; border: none; color: #fff; outline: none; width: 150px; }
        button { background: #00d4ff; border: none; color: #000; border-radius: 20px; padding: 5px 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sphere" id="ball"></div>
    <div id="status">ЖДУ КОМАНДЫ...</div>
    
    <div class="input-box">
        <input type="text" id="msg" placeholder="Текст..." autocomplete="off">
        <button id="send">></button>
    </div>

    <script>
        // Твой ключ
        const KEY = "AIzaSyALqFZBU96sFUZUCZOao1Di3XsyGpC3tWU";

        async function ask(text) {
            if (!text.trim()) return;
            const label = document.getElementById('status');
            label.innerText = "ОБРАБОТКА...";

            try {
                // ИСПОЛЬЗУЕМ БАЗОВУЮ МОДЕЛЬ gemini-pro (v1.0)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${KEY}`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Ты — Джарвис. Отвечай очень коротко. Вопрос: " + text }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    label.innerText = "ОШИБКА: " + data.error.message;
                    return;
                }

                const answer = data.candidates[0].content.parts[0].text;
                label.innerText = answer;

                const speech = new SpeechSynthesisUtterance(answer);
                speech.lang = 'ru-RU';
                window.speechSynthesis.speak(speech);

            } catch (err) {
                label.innerText = "ОШИБКА СЕТИ";
            }
        }

        document.getElementById('send').onclick = () => {
            const m = document.getElementById('msg');
            ask(m.value);
            m.value = '';
        };

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Recognition) {
            const rec = new Recognition();
            rec.lang = 'ru-RU';
            document.getElementById('ball').onclick = () => {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); 
                rec.start();
                document.getElementById('status').innerText = "СЛУШАЮ...";
                document.getElementById('ball').classList.add('listening');
            };
            rec.onresult = (e) => ask(e.results[0][0].transcript);
            rec.onend = () => document.getElementById('ball').classList.remove('listening');
        }
    </script>
</body>
</html>
