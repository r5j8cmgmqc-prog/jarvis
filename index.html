<script>
    const KEY = "AIzaSyALqFZBU96sFUZUCZOao1Di3XsyGpC3tWU";
    
    async function ask(text) {
        document.getElementById('status').innerText = "АНАЛИЗ...";
        try {
            // Используем проверенную модель gemini-1.5-flash через v1beta
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            // Если Google выдал ошибку в ответе, мы её увидим
            if (data.error) {
                document.getElementById('status').innerText = "ОШИБКА: " + data.error.message;
                return;
            }

            const reply = data.candidates[0].content.parts[0].text;
            document.getElementById('status').innerText = reply;
            
            const speech = new SpeechSynthesisUtterance(reply);
            speech.lang = 'ru-RU';
            window.speechSynthesis.speak(speech);
            
        } catch (err) {
            document.getElementById('status').innerText = "СБОЙ СЕТИ. ПРОВЕРЬ КЛЮЧ.";
        }
    }

    document.getElementById('send').onclick = () => {
        const val = document.getElementById('msg').value;
        if(val) ask(val);
    };
</script>
