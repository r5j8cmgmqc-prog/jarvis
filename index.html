<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS SYSTEM</title>
    <style>
        body { margin: 0; background: #000; color: #00d4ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .sphere { width: 100px; height: 100px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .sphere:active { transform: scale(0.9); box-shadow: 0 0 40px #fff; }
        #status { text-align: center; font-size: 14px; padding: 0 20px; margin-bottom: 20px; min-height: 40px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .input-box { display: flex; gap: 10px; background: #111; padding: 10px; border-radius: 25px; border: 1px solid #333; }
        input { background: none; border: none; color: #fff; outline: none; width: 180px; font-size: 16px; }
        button { background: #00d4ff; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sphere" id="ball"></div>
    <div id="status">СИСТЕМА ГОТОВА. НАПИШИТЕ ЧТО-НИБУДЬ</div>
    
    <div class="input-box">
        <input type="text" id="msg" placeholder="Запрос...">
        <button id="send">ОТПРАВИТЬ</button>
    </div>

    <script>
        // ТВОЙ КЛЮЧ
        const KEY = "AIzaSyALqFZBU96sFUZUCZOao1Di3XsyGpC3tWU";

        async function askJarvis(text) {
            const statusLabel = document.getElementById('status');
            statusLabel.innerText = "АНАЛИЗ ДАННЫХ...";

            try {
                // МЫ МЕНЯЕМ v1 на v1beta — ЭТО УБИРАЕТ ОШИБКУ 404
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    statusLabel.innerText = "ОШИБКА КЛЮЧА: " + data.error.message;
                    return;
                }

                const answer = data.candidates[0].content.parts[0].text;
                statusLabel.innerText = answer;

                // Озвучка
                const speech = new SpeechSynthesisUtterance(answer);
                speech.lang = 'ru-RU';
                window.speechSynthesis.speak(speech);

            } catch (err) {
                statusLabel.innerText = "СБОЙ СЕТИ. ПРОВЕРЬТЕ ИНТЕРНЕТ.";
            }
        }

        // Обработка кнопки
        document.getElementById('send').onclick = () => {
            const input = document.getElementById('msg');
            if (input.value.trim()) {
                askJarvis(input.value);
                input.value = '';
            }
        };

        // Обработка Enter
        document.getElementById('msg').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('send').click();
        });

        // Микрофон (упрощенный)
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';
            document.getElementById('ball').onclick = () => {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); // Активация звука
                rec.start();
                document.getElementById('status').innerText = "СЛУШАЮ...";
            };
            rec.onresult = (e) => askJarvis(e.results[0][0].transcript);
        }
    </script>
</body>
</html>
