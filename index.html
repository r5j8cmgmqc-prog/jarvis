<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS PRO</title>
    <style>
        body { margin: 0; background: #000; color: #00d4ff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        #brand { position: absolute; top: 30px; letter-spacing: 5px; opacity: 0.5; font-size: 10px; }
        .sphere { width: 120px; height: 120px; border: 2px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 25px #00d4ff; cursor: pointer; transition: 0.3s; background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, rgba(0,0,0,1) 70%); }
        .sphere:active { transform: scale(0.9); box-shadow: 0 0 50px #fff; }
        .listening { animation: pulse 1.5s infinite; border-color: #fff; box-shadow: 0 0 40px #fff; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #status { margin: 30px 0; text-align: center; font-size: 14px; padding: 0 25px; min-height: 60px; color: #fff; line-height: 1.5; text-transform: uppercase; }
        .input-box { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 30px; border: 1px solid #222; width: 80%; max-width: 400px; }
        input { background: none; border: none; color: #fff; outline: none; flex-grow: 1; font-size: 16px; }
        button { background: #00d4ff; border: none; padding: 0 15px; border-radius: 20px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="brand">EXTERNAL PROTOCOL ACTIVE</div>
    <div class="sphere" id="ball"></div>
    <div id="status">СИСТЕМА ГОТОВА<br>НАЖМИТЕ НА СФЕРУ ИЛИ НАПИШИТЕ ТЕКСТ</div>
    
    <div class="input-box">
        <input type="text" id="msg" placeholder="Введите запрос..." autocomplete="off">
        <button id="send">></button>
    </div>

    <script>
        const KEY = "AIzaSyALqFZBU96sFUZUCZOao1Di3XsyGpC3tWU";
        const ball = document.getElementById('ball');
        const statusLabel = document.getElementById('status');
        const inputField = document.getElementById('msg');

        async function askJarvis(text) {
            if (!text.trim()) return;
            statusLabel.innerHTML = "АНАЛИЗ ДАННЫХ...";

            try {
                // Пытаемся использовать 1.5-pro, так как flash выдавал 404
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${KEY}`;
                
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Ты Джарвис. Отвечай очень кратко и по делу. Вопрос: " + text }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    statusLabel.innerHTML = "ОШИБКА: " + data.error.message;
                    return;
                }

                const answer = data.candidates[0].content.parts[0].text;
                statusLabel.innerHTML = answer;

                // Озвучка ответа
                const speech = new SpeechSynthesisUtterance(answer);
                speech.lang = 'ru-RU';
                window.speechSynthesis.speak(speech);

            } catch (err) {
                statusLabel.innerHTML = "СБОЙ СЕТИ. ПРОВЕРЬТЕ ПОДКЛЮЧЕНИЕ.";
            }
        }

        // Кнопка отправки
        document.getElementById('send').onclick = () => {
            askJarvis(inputField.value);
            inputField.value = '';
        };

        // Отправка по Enter
        inputField.onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('send').click(); };

        // Работа с голосом (iPad Safari)
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';
            
            ball.onclick = () => {
                // Разблокировка звука на iOS
                window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); 
                try {
                    rec.start();
                    statusLabel.innerHTML = "СЛУШАЮ...";
                    ball.classList.add('listening');
                } catch(e) { 
                    statusLabel.innerHTML = "МИКРОФОН УЖЕ АКТИВИРОВАН"; 
                }
            };

            rec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                askJarvis(text);
            };

            rec.onend = () => ball.classList.remove('listening');
            rec.onerror = (e) => {
                statusLabel.innerHTML = "ДОСТУП ЗАПРЕЩЕН (ПРОВЕРЬТЕ НАСТРОЙКИ САФАРИ)";
                ball.classList.remove('listening');
            };
        } else {
            statusLabel.innerHTML = "ГОЛОСОВОЙ ВВОД НЕ ПОДДЕРЖИВАЕТСЯ ЭТИМ БРАУЗЕРОМ";
        }
    </script>
</body>
</html>
