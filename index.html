<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .jarvis-container { position: relative; width: 200px; height: 200px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .main-circle { width: 80px; height: 80px; border: 3px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 20px #00d4ff; transition: 0.3s; }
        .listening .main-circle { scale: 1.2; box-shadow: 0 0 40px #fff; border-color: #fff; }
        #status { margin-top: 30px; color: #00d4ff; text-align: center; font-size: 14px; max-width: 80%; min-height: 40px; }
        
        /* Поле ввода */
        .input-area { margin-top: 20px; display: flex; gap: 10px; background: #111; padding: 10px; border-radius: 20px; border: 1px solid #333; }
        input { background: none; border: none; color: #fff; outline: none; width: 150px; }
        button { background: #00d4ff; border: none; color: #000; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
        #mic-hint { font-size: 10px; color: #444; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="jarvis-container" id="jarvisBox">
        <div class="main-circle"></div>
    </div>

    <div id="status">Нажми на сферу или напиши</div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Сообщение...">
        <button id="sendBtn">></button>
    </div>
    
    <div id="mic-hint">Если "Service not allowed" — проверь Настройки -> Safari -> Микрофон</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const firebaseConfig = {
            apiKey: "AIzaSyDj7EzcDZu7Sm09_DmybHTbPmYsM16StVw",
            authDomain: "fadeai-19046.firebaseapp.com",
            projectId: "fadeai-19046",
            storageBucket: "fadeai-19046.firebasestorage.app",
            messagingSenderId: "11846696282",
            appId: "1:11846696282:web:6f74a162fa08e6b5318763",
            databaseURL: "https://fadeai-19046-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const genAI = new GoogleGenerativeAI(firebaseConfig.apiKey);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const statusText = document.getElementById('status');
        const jarvisBox = document.getElementById('jarvisBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const synth = window.speechSynthesis;

        // РАСПОЗНАВАНИЕ ГОЛОСА
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';

            jarvisBox.onclick = () => {
                const utter = new SpeechSynthesisUtterance(''); // Разблокировка звука
                synth.speak(utter);
                try {
                    recognition.start();
                    statusText.innerText = "Слушаю...";
                    jarvisBox.classList.add('listening');
                } catch (e) { statusText.innerText = "Ошибка: " + e.message; }
            };

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                askJarvis(text);
            };

            recognition.onend = () => jarvisBox.classList.remove('listening');
            recognition.onerror = (e) => { statusText.innerText = "Ошибка: " + e.error; jarvisBox.classList.remove('listening'); };
        }

        // ТЕКСТОВЫЙ ВВОД
        sendBtn.onclick = () => {
            if (userInput.value.trim()) {
                askJarvis(userInput.value);
                userInput.value = '';
            }
        };

        async function askJarvis(text) {
            statusText.innerText = "Джарвис думает...";
            try {
                const result = await model.generateContent("Ты Джарвис. Ответь кратко: " + text);
                const response = await result.response.text();
                statusText.innerText = response;
                
                // Сохранение в Firebase
                push(ref(db, 'history'), { q: text, a: response, time: Date.now() });

                // Озвучка
                const utter = new SpeechSynthesisUtterance(response);
                utter.lang = 'ru-RU';
                synth.speak(utter);
            } catch (err) { statusText.innerText = "Ошибка ИИ"; }
        }
    </script>
</body>
</html>
